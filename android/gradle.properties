# Deliberately no org.gradle.jvmargs here. Project-level jvmargs override the
# user-level ones, and this host needs a machine-specific JVM flag to start a
# daemon at all (see android/README.md). Heap tuning therefore lives in
# ~/.gradle/gradle.properties alongside it.

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official

android.useAndroidX=true
android.nonTransitiveRClass=true

# The Android platform the app targets. Overridable with
# -PchronicleTargetSdk=36 for a sideload build targeting a shipped Android
# version, when a device refuses an APK built against a newer platform.
# compileSdk is fixed at 37: the Compose BOM's own libraries require it.
chronicleTargetSdk=37
