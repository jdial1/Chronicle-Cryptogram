name: EAS Android

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS profile
        type: choice
        options:
          - preview
          - production
          - adi
          - test
        default: preview

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Require EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::EXPO_TOKEN is not set. EAS cannot authenticate without it."
            echo "Create a token at https://expo.dev/settings/access-tokens and add it"
            echo "as a repository secret named EXPO_TOKEN."
            exit 1
          fi
        working-directory: .
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install eas-cli
        uses: expo/expo-github-action@v8
        timeout-minutes: 10
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install mobile dependencies
        run: npm ci --no-audit --no-fund
        timeout-minutes: 10
      - name: EAS build
        run: eas build --platform android --profile ${{ github.event.inputs.profile }} --non-interactive
        timeout-minutes: 90
        env:
          ADI_REGISTRATION_TOKEN: ${{ secrets.ADI_REGISTRATION_TOKEN }}
