appId: com.chroniclecryptogram
# WebView HTML is often invisible to Android accessibility.
androidWebViewHierarchy: devtools
---
# Do not match "Chronicle" — that is the launcher icon after a WebView crash.
- launchApp
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: smoke-launched
- assertNotVisible: "Play Store"
- tapOn:
    text: "ENTER"
    optional: true
- tapOn:
    css: "#splash-enter"
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: smoke-after-enter
- assertNotVisible: "Play Store"
- assertNotVisible: "Unfortunately"
- assertNotVisible: "has stopped"
